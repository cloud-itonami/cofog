syntax = "proto3";

package cofog.civil_defense.v1;

option go_package = "github.com/etzhayyimcojp/etzhayyim-kyber/performers/etzhayyim-services-cofog-0220-civil-defense/proto;cofogproto";

service CivilDefenseService {
  rpc SubmitSignedEvent(SubmitSignedEventRequest) returns (SubmitSignedEventResponse);
  rpc GetEventStatus(GetEventStatusRequest) returns (GetEventStatusResponse);
  rpc SubmitApproval(SubmitApprovalRequest) returns (SubmitApprovalResponse);
  rpc AssessAreaResilience(AssessAreaResilienceRequest) returns (AssessAreaResilienceResponse);
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  ALERT_ISSUED = 1;
  ALERT_UPDATED = 2;
  ALERT_CANCELLED = 3;
  SHELTER_STATUS = 4;
  FACILITY_OUTAGE = 5;
  RESOURCE_REQUEST = 6;
}

enum HazardKind {
  HAZARD_KIND_UNSPECIFIED = 0;
  AIR_RAID = 1;
  MISSILE_THREAT = 2;
  EXPLOSION_RISK = 3;
  INFRASTRUCTURE_OUTAGE = 4;
  ALL_HAZARDS = 5;
}

message AdministrativeArea {
  string country_code = 1;
  string code = 2;
}

message Hazard {
  HazardKind kind = 1;
  string severity = 2;
}

message CivilEvent {
  string schema_version = 1;
  string event_id = 2;
  EventKind kind = 3;
  string authority_id = 4;
  int64 issued_at_unix_ms = 5;
  int64 effective_at_unix_ms = 6;
  int64 expires_at_unix_ms = 7;
  AdministrativeArea area = 8;
  string source_url = 9;
  Hazard hazard = 10;
  repeated string instructions = 11;
  string references_event_id = 12;
  string status = 13;
  string capacity_band = 14;
  string resource_kind = 15;
  string summary = 16;
  string source_origin = 17;
}

message SignedCivilEvent {
  // Signature covers canonical document bytes represented as lowercase hexadecimal by
  // canonical-event in the canonical sibling component.
  CivilEvent event = 1;
  bytes ed25519_signature = 2;
}

message SubmitSignedEventRequest {
  SignedCivilEvent envelope = 1;
}

message SubmitSignedEventResponse {
  int32 outcome = 1;
  string event_id = 2;
  int64 reason_mask = 3;
  int64 proposed_operation = 4;
  bool requires_human_approval = 5;
}

message GetEventStatusRequest {
  string event_id = 1;
}

message GetEventStatusResponse {
  bool found = 1;
  string event_hash = 2;
  uint64 ledger_sequence = 3;
}

message Approval {
  string schema_version = 1;
  string approval_id = 2;
  string approver_id = 3;
  string event_id = 4;
  string event_hash = 5;
  int64 operation = 6;
  int64 approved_at_unix_ms = 7;
  int64 expires_at_unix_ms = 8;
}

message SignedApproval {
  // Signature covers canonical document bytes represented as lowercase hexadecimal by
  // approval-canonical in the canonical sibling component.
  Approval approval = 1;
  bytes ed25519_signature = 2;
}

message SubmitApprovalRequest {
  string event_id = 1;
  SignedApproval envelope = 2;
}

message SubmitApprovalResponse {
  int32 outcome = 1;
  int64 reason_mask = 2;
  string outbox_id = 3;
  string approval_payload_hash = 4;
}

message ProhibitedBoundaryEvidence {
  bool precise_coordinate = 1;
  bool trajectory = 2;
  bool targeting = 3;
  bool sensor_track = 4;
  bool weapon_assignment = 5;
  bool interceptor_or_weapon = 6;
  bool military_unit_location = 7;
  bool person_or_device_location = 8;
}

message AssessAreaResilienceRequest {
  AdministrativeArea area = 1;
  int64 now_unix_ms = 2;
  int64 expires_at_unix_ms = 3;
  int64 valid_source_count = 4;
  int64 required_quorum = 5;
  int64 highest_severity = 6;
  int64 revoked_source_count = 7;
  int64 stale_source_count = 8;
  string source_set_hash = 9;
  ProhibitedBoundaryEvidence prohibited = 10;
}

message AssessAreaResilienceResponse {
  int32 outcome = 1;
  int64 reason_mask = 2;
  int64 severity = 3;
  int64 expires_at_unix_ms = 4;
  string canonical_assessment_hex = 5;
}
